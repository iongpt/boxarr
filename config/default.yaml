# Boxarr Default Configuration
# Copy this file to config.yaml and modify as needed
#
# Which file is read: Boxarr reads ONE settings file from its data directory
# (/config in Docker): local.yaml when it exists, otherwise config.yaml. The
# setup page saves to local.yaml. Its first save starts from config.yaml, so
# every setting written there is kept in the new local.yaml; from then on
# local.yaml is the file Boxarr reads, and config.yaml is left as it is but
# no longer read (Boxarr logs a warning while both exist). Edit local.yaml
# after that. Environment variables override both files.

version: 1

# Radarr connection (REQUIRED)
radarr:
  url: "http://localhost:7878"  # Change to your Radarr URL
  api_key: ""                    # Add your Radarr API key here
  root_folder: "/movies"
  quality_profile_default: "HD-1080p"
  quality_profile_upgrade: "Ultra-HD"

# Boxarr settings
boxarr:
  # Server configuration
  host: "0.0.0.0"
  port: 8888
  
  # Scheduler configuration  
  scheduler:
    enabled: true
    # Day of week uses APScheduler numbering, Monday=0 ... Sunday=6 (not
    # crontab's Sunday=0), so 2 is Wednesday. The time is in the scheduler
    # timezone: BOXARR_SCHEDULER_TIMEZONE or TZ when set, else
    # boxarr.scheduler.timezone, else America/New_York.
    cron: "0 23 * * 2"  # Wednesday at 11 PM
    
  # Feature flags
  features:
    auto_add: true
    quality_upgrade: true
    notifications: false
    # Auto-add skips films on Radarr's exclusion list (needs Radarr 5.9 or
    # later). On by default; set to false to add them anyway. Settings file
    # or BOXARR_FEATURES_AUTO_ADD_SKIP_RADARR_EXCLUSIONS only: the setup page
    # has no field for it, and its save keeps this value.
    # auto_add_skip_radarr_exclusions: true
    # Box Office Mojo region 'area' code (e.g. "NL", "DE", "GB").
    # Empty means US & Canada domestic (no ?area parameter).
    # Up to 5 regions can be listed, and their order is kept; "domestic"
    # stands for US & Canada. Quoting "NO" (Norway) is optional: YAML reads
    # an unquoted NO as false, which Boxarr takes to mean Norway.
    #   box_office_region:
    #     - domestic
    #     - DE
    #     - "NO"
    # The environment variable BOXARR_FEATURES_BOX_OFFICE_REGION takes the
    # same regions as NL, domestic,DE or ["NL","DE"].
    # Each region's chart is fetched on its own and merged into one list per
    # week, a film charting in several regions appearing once. The fetch
    # limit (box_office_limit, 1-30, default 10) is the number of movies read
    # from EACH region's chart; auto_add_limit is at most X movies added per
    # run, across all your regions.
    box_office_region: ""
  
  # UI configuration
  ui:
    theme: "purple"
    # Remove ignored movies from the weekly and overview lists instead of
    # dimming them. They stay listed under Overview -> Ignored.
    hide_ignored: false
    cards_per_row:
      mobile: 1
      tablet: 3
      desktop: 4
      4k: 5
      
  # Data storage
  data:
    directory: "/config"
    history_retention_days: 90

# Box Office Mojo HTTP request timeout in seconds (default 120, range 5-600)
boxoffice_timeout: 120

# Logging
log_level: "INFO"